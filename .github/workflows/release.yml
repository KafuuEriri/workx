name: release

# One-shot multi-platform release pipeline.
#
# Enter a version (e.g. 0.0.3) and the workflow:
#
#   1. Bumps the release version across the repo manifests with
#      `scripts/bump_release_version.py`, commits it to the current branch, and
#      creates/pushes the `rust-v<version>` tag at that commit.
#   2. Builds `workx-package-<target>.tar.gz` from that tag on a native runner
#      per platform (no cross-compilation from a single host):
#        - ubuntu-24.04   -> x86_64-unknown-linux-musl  (WSL / Linux x64)
#        - windows-latest -> x86_64-pc-windows-msvc     (Windows x64)
#        - macos-15       -> aarch64-apple-darwin       (macOS Apple Silicon)
#   3. Publishes the release with a combined `workx-package_SHA256SUMS`.
#
# Optional extra matrix rows (uncomment the matching `include` entry):
#   - linux arm64: os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl
#   - macOS Intel: os: macos-13,         target: x86_64-apple-darwin
#
# Notes:
#   - The bump commit and tag are pushed with the default GITHUB_TOKEN, which
#     does not re-trigger other workflows. If the default branch is protected,
#     provide a PAT (e.g. a RELEASE_PAT secret) and push with it instead.
#   - Rerunning the same version rebuilds from current `main` HEAD and moves the
#     tag there, so a failed or outdated run can be republished in place.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Semantic version to publish (e.g. 0.0.3). Bumps repo manifests and tags rust-v<version>."
        required: true
        type: string

concurrency:
  group: release-${{ github.event.inputs.version }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  bump-version:
    name: Bump version, commit, and tag
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      sha: ${{ steps.resolve.outputs.sha }}
      changed: ${{ steps.resolve.outputs.changed }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Configure git identity
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump version manifests
        id: resolve
        shell: bash
        run: |
          version="${{ github.event.inputs.version }}"
          python3 scripts/bump_release_version.py "$version"
          if git diff --quiet; then
            changed="false"
            echo "Version $version is already committed; nothing to bump."
          else
            changed="true"
            git add -u
            git commit -m "chore: bump version to $version"
          fi
          {
            echo "version=$version"
            echo "tag=rust-v$version"
            echo "sha=$(git rev-parse HEAD)"
            echo "changed=$changed"
          } >> "$GITHUB_OUTPUT"

      - name: Push bump commit and release tag
        shell: bash
        run: |
          if [ "${{ steps.resolve.outputs.changed }}" = "true" ]; then
            git push origin HEAD:"${{ github.ref_name }}"
          fi
          git tag -f "${{ steps.resolve.outputs.tag }}" "${{ steps.resolve.outputs.sha }}"
          git push origin --force "refs/tags/${{ steps.resolve.outputs.tag }}"

  create-release:
    name: Create draft release
    needs: bump-version
    runs-on: ubuntu-24.04
    env:
      GH_REPO: ${{ github.repository }}
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Resolve release metadata
        id: resolve
        shell: bash
        run: |
          echo "version=${{ needs.bump-version.outputs.version }}" >> "$GITHUB_OUTPUT"
          echo "tag=${{ needs.bump-version.outputs.tag }}" >> "$GITHUB_OUTPUT"

      - name: Create or update draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ needs.bump-version.outputs.tag }}"
          version="${{ needs.bump-version.outputs.version }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --draft=true --title "Workx $version"
          else
            gh release create "$tag" \
              --draft=true \
              --title "Workx $version" \
              --notes "Preparing release $version..."
          fi

          # Drop package assets left over from previous attempts so the
          # published set always matches the current build. This must run
          # before the matrix jobs upload their fresh packages.
          for asset in $(gh release view "$tag" --json assets -q '.assets[].name'); do
            case "$asset" in
              workx-package-*) gh release delete-asset "$tag" "$asset" -y ;;
            esac
          done

  build-package:
    name: ${{ matrix.name }}
    needs:
      - bump-version
      - create-release
    runs-on: ${{ matrix.os }}
    env:
      WORKX_REPO_ROOT: ${{ github.workspace }}
      VERSION: ${{ needs.create-release.outputs.version }}
      TAG: ${{ needs.create-release.outputs.tag }}
      GH_REPO: ${{ github.repository }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64 (WSL)
            os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            apt: musl-tools nasm pkg-config
            python: python3
            build_musl_libcap: true
          - name: Windows x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            apt: ""
            python: python
          - name: macOS Apple Silicon
            # macos-14 ships an older Xcode whose ld cannot link the oversized
            # arm64 `workx` binary (ld: B/BL out of range); use a current image.
            os: macos-15
            target: aarch64-apple-darwin
            apt: ""
            python: python3
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.bump-version.outputs.tag }}

      - name: Install Linux cross-compile dependencies
        if: matrix.apt != ''
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.apt }}

      - name: Build static libcap for musl bwrap
        if: matrix.build_musl_libcap
        shell: bash
        run: |
          set -euo pipefail
          # Provide Linux UAPI headers (linux/loop.h, linux/capability.h) for
          # bubblewrap; musl-gcc does not search glibc include dirs, so they
          # are listed in the libcap.pc Cflags below.
          sudo apt-get install -y linux-libc-dev
          prefix="$RUNNER_TEMP/musl-libcap"
          src="$RUNNER_TEMP/libcap"
          git clone --depth=1 https://git.kernel.org/pub/scm/libs/libcap/libcap.git "$src"
          make -C "$src/libcap" -j"$(nproc)" libcap.a CC=musl-gcc
          mkdir -p "$prefix/lib/pkgconfig" "$prefix/include/sys"
          cp "$src/libcap/libcap.a" "$prefix/lib/"
          cp "$src/libcap/include/sys/capability.h" "$prefix/include/sys/"
          cat > "$prefix/lib/pkgconfig/libcap.pc" <<EOF
          prefix=$prefix
          libdir=\${prefix}/lib
          includedir=\${prefix}/include

          Name: libcap
          Description: libcap built with musl-gcc for the static Workx bwrap
          Version: 2.69
          Libs: -L\${libdir} -lcap
          # bubblewrap.c/network.c include Linux UAPI headers (linux/loop.h,
          # linux/capability.h), which musl-gcc does not search in /usr/include.
          # bwrap's build.rs turns every -I here into -idirafter, so list the
          # glibc/kernel header dirs after the libcap include dir.
          Cflags: -I\${includedir} -I/usr/include -I/usr/include/x86_64-linux-gnu
          EOF
          {
            echo "PKG_CONFIG_PATH=$prefix/lib/pkgconfig"
            echo "PKG_CONFIG_ALLOW_CROSS=1"
            echo "CC_x86_64_unknown_linux_musl=musl-gcc"
            echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc"
          } >> "$GITHUB_ENV"

      - name: Install Rust 1.95.0
        shell: bash
        run: |
          rustup toolchain install 1.95.0
          rustup component add --toolchain 1.95.0 rust-src
          rustup target add --toolchain 1.95.0 "${{ matrix.target }}"
          rustup default 1.95.0

      - name: Build package archive
        shell: bash
        run: |
          ${{ matrix.python }} scripts/build_workx_package.py \
            --target "${{ matrix.target }}" \
            --cargo-profile release \
            --package-version "$VERSION" \
            --archive-output "$RUNNER_TEMP/workx-package-${{ matrix.target }}.tar.gz" \
            --force

      - name: Upload package asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$TAG" \
            "$RUNNER_TEMP/workx-package-${{ matrix.target }}.tar.gz" \
            --clobber

  finalize-release:
    name: Publish release
    needs:
      - create-release
      - build-package
    runs-on: ubuntu-24.04
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Rebuild checksums from uploaded packages
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ needs.create-release.outputs.tag }}"
          assets_dir="$(mktemp -d)"
          cd "$assets_dir"
          gh release download "$tag" --pattern 'workx-package-*.tar.gz'
          sha256sum workx-package-*.tar.gz > workx-package_SHA256SUMS
          cat workx-package_SHA256SUMS
          gh release upload "$tag" workx-package_SHA256SUMS --clobber

      - name: Flip draft to public
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ needs.create-release.outputs.tag }}"
          version="${{ needs.create-release.outputs.version }}"
          notes="## Workx $version

          Native prebuilt packages for Windows, WSL/Linux, and macOS:

          - Windows x86_64: \`workx-package-x86_64-pc-windows-msvc.tar.gz\`
          - WSL / Linux x86_64: \`workx-package-x86_64-unknown-linux-musl.tar.gz\`
          - macOS Apple Silicon: \`workx-package-aarch64-apple-darwin.tar.gz\`

          Install on Windows (PowerShell):

          \`\`\`
          irm https://raw.githubusercontent.com/RonanXiao/workx/main/scripts/install/install.ps1 | iex
          \`\`\`

          Install on WSL / Linux / macOS:

          \`\`\`
          curl -fsSL https://raw.githubusercontent.com/RonanXiao/workx/main/scripts/install/install.sh | sh
          \`\`\`"
          gh release edit "$tag" \
            --draft=false \
            --title "Workx $version" \
            --notes "$notes"
