[package]
edition.workspace = true
license.workspace = true
name = "workx-models-manager"
version.workspace = true

[lib]
doctest = false
name = "workx_models_manager"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
chrono = { workspace = true, features = ["serde"] }
workx-collaboration-mode-templates = { workspace = true }
workx-http-client = { workspace = true }
workx-login = { workspace = true }
workx-otel = { workspace = true }
workx-protocol = { workspace = true }
workx-utils-output-truncation = { workspace = true }
workx-utils-template = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["fs", "sync", "time"] }
tracing = { workspace = true, features = ["log"] }

[dev-dependencies]
pretty_assertions = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
