[package]
edition.workspace = true
license.workspace = true
name = "workx-goal-extension"
version.workspace = true

[lib]
name = "workx_goal_extension"
path = "src/lib.rs"
test = false
doctest = false

[lints]
workspace = true

[dependencies]
workx-analytics = { workspace = true }
workx-core = { workspace = true }
workx-extension-api = { workspace = true }
workx-otel = { workspace = true }
workx-protocol = { workspace = true }
workx-rollout = { workspace = true }
workx-state = { workspace = true }
workx-tools = { workspace = true }
workx-utils-template = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
tracing = { workspace = true }

[dev-dependencies]
anyhow = { workspace = true }
chrono = { workspace = true }
workx-utils-absolute-path = { workspace = true }
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
