[package]
edition.workspace = true
license.workspace = true
name = "workx-memories-extension"
version.workspace = true

[lib]
name = "workx_memories_extension"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
workx-core = { workspace = true }
workx-extension-api = { workspace = true }
workx-features = { workspace = true }
workx-otel = { workspace = true }
workx-tools = { workspace = true }
workx-utils-absolute-path = { workspace = true }
workx-utils-output-truncation = { workspace = true }
workx-utils-template = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs"] }

[dev-dependencies]
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["fs", "macros"] }
