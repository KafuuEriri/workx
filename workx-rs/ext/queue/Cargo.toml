[package]
edition.workspace = true
license.workspace = true
name = "workx-queue-extension"
version.workspace = true

[lib]
name = "workx_queue_extension"
path = "src/lib.rs"
test = false
doctest = false

[lints]
workspace = true

[dependencies]
workx-core = { workspace = true }
workx-extension-api = { workspace = true }
workx-protocol = { workspace = true }
workx-thread-store = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "time"] }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v7"] }

[dev-dependencies]
anyhow = { workspace = true }
workx-state = { workspace = true }
workx-utils-absolute-path = { workspace = true }
core_test_support = { workspace = true }
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
