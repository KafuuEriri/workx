[package]
name = "workx-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"
default-run = "workx"

[[bin]]
name = "workx"
path = "src/main.rs"

[[bin]]
name = "logs_client"
path = "src/bin/logs_client.rs"

[lib]
name = "workx_cli"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }
clap_complete = { workspace = true }
workx-app-server = { workspace = true }
workx-app-server-daemon = { workspace = true }
workx-app-server-protocol = { workspace = true }
workx-app-server-test-client = { workspace = true }
workx-arg0 = { workspace = true }
workx-api = { workspace = true }
workx-chatgpt = { workspace = true }
workx-cloud-config = { workspace = true }
workx-cloud-tasks = { path = "../cloud-tasks" }
workx-utils-cli = { workspace = true }
workx-config = { workspace = true }
workx-core = { workspace = true }
workx-core-plugins = { workspace = true }
workx-history = { workspace = true }
workx-home = { workspace = true }
workx-http-client = { workspace = true }
workx-exec = { workspace = true }
workx-exec-server = { workspace = true }
workx-execpolicy = { workspace = true }
workx-extension-api = { workspace = true }
workx-features = { workspace = true }
workx-git-attribution = { workspace = true }
workx-git-utils = { workspace = true }
workx-install-context = { workspace = true }
workx-login = { workspace = true }
workx-memories-write = { workspace = true }
workx-mcp = { workspace = true }
workx-mcp-server = { workspace = true }
workx-model-provider = { workspace = true }
workx-models-manager = { workspace = true }
workx-plugin = { workspace = true }
workx-protocol = { workspace = true }
workx-responses-api-proxy = { workspace = true }
workx-rmcp-client = { workspace = true }
workx-rollout = { workspace = true }
workx-rollout-trace = { workspace = true }
workx-sandboxing = { workspace = true }
workx-skills-extension = { workspace = true }
workx-state = { workspace = true }
workx-stdio-to-uds = { workspace = true }
workx-terminal-detection = { workspace = true }
workx-thread-store = { workspace = true }
workx-tui = { workspace = true }
workx-utils-absolute-path = { workspace = true }
workx-utils-path = { workspace = true }
crossterm = { workspace = true }
http = { workspace = true }
libc = { workspace = true }
os_info = { workspace = true }
owo-colors = { workspace = true }
regex-lite = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
supports-color = { workspace = true }
sys-locale = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = [
    "io-std",
    "macros",
    "net",
    "process",
    "rt-multi-thread",
    "signal",
    "time",
] }
toml = { workspace = true }
tracing = { workspace = true }
tracing-appender = { workspace = true }
tracing-subscriber = { workspace = true }
unicode-segmentation = { workspace = true }
url = { workspace = true }
which = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
workx_windows_sandbox = { package = "workx-windows-sandbox", path = "../windows-sandbox-rs" }
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_Storage_Packaging_Appx",
    "Win32_System_Console",
    "Win32_System_Threading",
] }

[dev-dependencies]
app_test_support = { workspace = true }
assert_cmd = { workspace = true }
assert_matches = { workspace = true }
workx-utils-cargo-bin = { workspace = true }
flate2 = { workspace = true }
futures = { workspace = true }
insta = { workspace = true }
predicates = { workspace = true }
pretty_assertions = { workspace = true }
sqlx = { workspace = true }
tar = { workspace = true }
tokio-tungstenite = { workspace = true }
wiremock = { workspace = true }
zstd = { workspace = true }

[package.metadata.cargo-shear]
# These Rust sources are intentionally Bazel-only macrobenchmarks rather than
# Cargo targets.
ignored-paths = ["e2e_benches/*.rs"]
