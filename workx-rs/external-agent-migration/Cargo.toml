workx-login = { workspace = true }
workx-memories-write = { workspace = true }
workx-otel = { workspace = true }
workx-plugin = { workspace = true }
workx-protocol = { workspace = true }
workx-rollout = { workspace = true }
workx-thread-store = { workspace = true }
workx-utils-output-truncation = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
sha2 = { workspace = true }
toml = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync"] }
tracing = { workspace = true }

[dev-dependencies]
workx-app-server-protocol = { workspace = true }
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
