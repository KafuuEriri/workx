[package]
edition.workspace = true
license.workspace = true
name = "workx-memories-write"
version.workspace = true

[lib]
name = "workx_memories_write"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
chrono = { workspace = true }
workx-backend-client = { workspace = true }
workx-core = { workspace = true }
workx-config = { workspace = true }
workx-features = { workspace = true }
workx-git-utils = { workspace = true }
workx-login = { workspace = true }
workx-model-provider = { workspace = true }
workx-otel = { workspace = true }
workx-protocol = { workspace = true }
workx-rollout = { workspace = true }
workx-rollout-trace = { workspace = true }
workx-secrets = { workspace = true }
workx-state = { workspace = true }
workx-terminal-detection = { workspace = true }
workx-utils-absolute-path = { workspace = true }
workx-utils-output-truncation = { workspace = true }
workx-utils-template = { workspace = true }
futures = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["fs", "rt", "sync", "time"] }
tracing = { workspace = true, features = ["log"] }
uuid = { workspace = true, features = ["v4", "v5"] }

[dev-dependencies]
workx-model-provider-info = { workspace = true }
workx-models-manager = { workspace = true }
core_test_support = { workspace = true }
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["fs", "macros"] }
wiremock = { workspace = true }
